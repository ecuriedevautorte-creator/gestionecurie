name: Vérifier la base partagée

# Lancement manuel : contrôle que la base Supabase répond, que le script d'installation
# a bien été exécuté et que rien n'est accessible sans compte.
on: workflow_dispatch

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger la base
        run: |
          U=$(grep -oP "SUPABASE_URL = '\K[^']+" src/config.ts)
          K=$(grep -oP "SUPABASE_CLE_PUBLIQUE = '\K[^']+" src/config.ts)
          note() { r=$(curl -sS "${@:2}" | tr -d '\n' | cut -c1-400); echo "::notice title=$1::$r"; }
          note "reglages" "$U/auth/v1/settings" -H "apikey: $K"
          note "etat sans compte" "$U/rest/v1/etat?select=cle" -H "apikey: $K"
          note "fiches sans compte" "$U/rest/v1/fiches?select=id&limit=1" -H "apikey: $K"
          note "table inexistante" "$U/rest/v1/nexistepas?select=x" -H "apikey: $K"
          note "rpc sans compte" -X POST "$U/rest/v1/rpc/appliquer_journal" -H "apikey: $K" -H "Content-Type: application/json" -d '{"entrees":[]}'
          note "inscription inconnu" -X POST "$U/auth/v1/signup" -H "apikey: $K" -H "Content-Type: application/json" -d '{"email":"test-intrus@example.com","password":"MotDePasse-Test-123"}'
